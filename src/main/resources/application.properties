spring.application.name=webhook-replay

# Virtual threads: the point of Java 21 here. Delivery is thousands of concurrent
# blocking outbound HTTP calls, which is the workload they are actually good at.
spring.threads.virtual.enabled=true

# Defaults match docker-compose.yml so a fresh clone runs with no env setup.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:webhook_replay}
spring.datasource.username=${DB_USER:webhook}
spring.datasource.password=${DB_PASSWORD:webhook}

# This file is deliberately pure ASCII. Spring Boot reads .properties as ISO-8859-1
# (the java.util.Properties spec), not UTF-8, so a UTF-8 em-dash arrives as three
# characters. Harmless in a comment; silent corruption in a value.

# Flyway owns the schema; Hibernate only checks that it matches. Never `update` --
# that lets the entity model silently drift from the migrations, and the migrations
# are what actually runs in production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# The wire format is snake_case throughout DESIGN.md sections 3 and 4 -- event_id,
# event_types, signing_secret, idempotency_key. Setting it once here beats a
# @JsonProperty on every DTO field for the rest of the project, and makes the Java
# field names free to stay idiomatic camelCase.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Serves health at /health rather than /actuator/health. Only `health` is web-exposed
# by default, so nothing else lands at the root.
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always

# Static per-tenant API keys (DESIGN.md section 3) are deliberately NOT defined here.
#
# Boot MERGES Map-typed properties across sources rather than replacing them, so a key
# committed in this file cannot be removed by an operator supplying their own -- theirs
# would be added alongside it, and the committed one would keep working in production.
# A packaged default is therefore a permanent backdoor, not a convenience.
#
# Development keys live in application-local.properties. Run with:
#     ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Tests declare their own fixture keys. See DECISIONS.md #10.

# Without this, Boot auto-configures an in-memory user and logs a generated password at
# every startup. There is no user model here -- tenants authenticate with API keys -- so
# the bean is dead weight and the log line is a lie about how this service authenticates.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
