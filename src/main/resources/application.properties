spring.application.name=webhook-replay

# Virtual threads: the point of Java 21 here. Delivery is thousands of concurrent
# blocking outbound HTTP calls, which is the workload they are actually good at.
spring.threads.virtual.enabled=true

# Defaults match docker-compose.yml so a fresh clone runs with no env setup.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:webhook_replay}
spring.datasource.username=${DB_USER:webhook}
spring.datasource.password=${DB_PASSWORD:webhook}

# Flyway owns the schema; Hibernate only checks that it matches. Never `update` —
# that lets the entity model silently drift from the migrations, and the migrations
# are what actually runs in production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Serves health at /health rather than /actuator/health. Only `health` is web-exposed
# by default, so nothing else lands at the root.
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always

# Static per-tenant API keys (DESIGN.md §3). Bracket notation is deliberate: relaxed
# binding normalises bare map keys, and these are opaque credentials that must bind
# exactly as written. Development values — see DECISIONS.md #10 for why plaintext keys
# in config are acceptable for v1 and what replaces them.
webhook-replay.api-keys[sk_test_alice]=11111111-1111-1111-1111-111111111111
webhook-replay.api-keys[sk_test_bob]=22222222-2222-2222-2222-222222222222

# Without this, Boot auto-configures an in-memory user and logs a generated password at
# every startup. There is no user model here — tenants authenticate with API keys — so the
# bean is dead weight and the log line is a lie about how this service authenticates.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
